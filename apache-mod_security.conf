# Configuration file for the mod_security Apache module

LoadModule security2_module modules/mod_security2.so

<IfModule mod_security2.c>
	# engine settings (modsecurity.conf), CRS setup, local rules
	IncludeOptional conf.d/modsecurity.d/*.conf
	IncludeOptional conf.d/modsecurity.d/activated_rules/*.conf
</IfModule>
